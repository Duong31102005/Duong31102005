  <text x="76" y="215" fill="url(#cyan)" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" letter-spacing="1">× AI SYSTEMS</text>
  <text x="80" y="255" fill="#9cb1c4" font-family="Arial,Helvetica,sans-serif" font-size="18">Perception  ·  Autonomy  ·  Connected software</text>
