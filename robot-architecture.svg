<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AI Robot system architecture</title>
  <desc id="desc">Camera vision and microphone speech recognition feed a Python AI server, which sends commands to a Raspberry Pi ROS 2 controller and ESP32 motor hardware.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111c35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 22px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;fill:#e2e8f0}
      .sub{font:500 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;fill:#94a3b8}
      .label{font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.3px;fill:#7dd3fc}
      .main{font:600 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f8fafc}
      .small{font:500 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#94a3b8}
      .node{fill:#111827;stroke:#334155;stroke-width:1.5}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#24324a"/>
  <text x="40" y="48" class="title">AI ROBOT / SYSTEM ARCHITECTURE</text>
  <text x="40" y="72" class="sub">VISION  ·  SPEECH  ·  EMBEDDED CONTROL</text>
  <rect x="40" y="91" width="1120" height="2" rx="1" fill="url(#accent)"/>
  <path class="line" d="M160 170H208"/>
  <path class="line" d="M160 290H208"/>
  <path class="line" d="M445 170C475 170 480 195 510 195"/>
  <path class="line" d="M445 290C475 290 480 265 510 265"/>
  <path class="line" d="M710 230H765"/>
  <path class="line" d="M955 230H1005"/>
  <rect class="node" x="35" y="132" width="125" height="76" rx="14"/>
  <circle cx="60" cy="158" r="8" fill="#38bdf8"/>
  <text x="79" y="162" class="label">INPUT 01</text>
  <text x="52" y="188" class="main">Camera</text>
  <rect class="node" x="35" y="252" width="125" height="76" rx="14"/>
  <circle cx="60" cy="278" r="8" fill="#a78bfa"/>
  <text x="79" y="282" class="label">INPUT 02</text>
  <text x="52" y="308" class="main">Microphone</text>
  <rect class="node" x="210" y="132" width="235" height="76" rx="14"/>
  <text x="232" y="158" class="label">COMPUTER VISION</text>
  <text x="232" y="184" class="main">YOLO11s · Tracking</text>
  <rect class="node" x="210" y="252" width="235" height="76" rx="14"/>
  <text x="232" y="278" class="label">SPEECH AI</text>
  <text x="232" y="304" class="main">Whisper · Vietnamese STT</text>
  <rect x="510" y="177" width="200" height="106" rx="16" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="532" y="205" class="label">INFERENCE + ROUTING</text>
  <text x="532" y="234" class="main">Python AI Server</text>
  <text x="532" y="257" class="small">Target selection · Commands</text>
  <rect class="node" x="765" y="177" width="190" height="106" rx="16"/>
  <text x="787" y="205" class="label">ROBOT CONTROL</text>
  <text x="787" y="234" class="main">Raspberry Pi</text>
  <text x="787" y="257" class="small">ROS 2 · HTTP / JSON</text>
  <rect class="node" x="1005" y="177" width="160" height="106" rx="16"/>
  <text x="1026" y="205" class="label">HARDWARE</text>
  <text x="1026" y="234" class="main">ESP32</text>
  <text x="1026" y="257" class="small">Motor control</text>
  <text x="735" y="216" class="small">commands</text>
  <text x="972" y="216" class="small">serial</text>
  <text x="40" y="382" class="small">DESIGNED FOR REAL-TIME PERCEPTION, VOICE INPUT, AND SAFE ROBOT CONTROL</text>
</svg>